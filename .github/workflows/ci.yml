name: CI

on:
    pull_request:
    push:
        branches:
            - master
    workflow_dispatch:

jobs:
    validation:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: [
                    '8.3',
                    '8.5'
                ]

        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, intl, pdo_mysql, grpc

            - name: Checkout
              uses: actions/checkout@v4

            - name: Composer validate
              run: composer validate

            - name: Composer get cache directory
              id: composer-cache
              run: |
                  echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Composer cache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Allow php-http/discovery Composer plugin
              # Writes into the checked-out (uncommitted) composer.json for this CI run
              # only - never git-added/pushed, so it never lands in the tracked file that
              # dev:composer:update-json-files (in the suite monorepo) would otherwise strip
              # this entry back out of, since it enforces one fixed allow-plugins entry there.
              # `composer global config` was tried first but wasn't honored by every composer
              # subcommand here (still blocked under `composer update --prefer-lowest`), so the
              # project-local config is used instead - Composer always respects that directly.
              run: composer config --no-plugins allow-plugins.php-http/discovery true

            - name: Composer install
              run: |
                  composer --version
                  composer install --optimize-autoloader

            - name: Codeception tests
              run: |
                  if [[ ${{ matrix.php-version }} == '8.2' ]]; then
                    vendor/bin/codecept build
                    XDEBUG_MODE=coverage vendor/bin/codecept run --coverage-xml
                  else
                    composer test
                  fi

            - name: Code Coverage Report
              if: success() && matrix.php-version == '8.2'
              uses: codecov/codecov-action@v1

    prefer-lowest:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: [
                    '8.3'
                ]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, intl, pdo_mysql, grpc

            - name: Get Composer Cache Directory
              id: composer-cache
              run: |
                  echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Composer cache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Allow php-http/discovery Composer plugin
              # Writes into the checked-out (uncommitted) composer.json for this CI run
              # only - never git-added/pushed, so it never lands in the tracked file that
              # dev:composer:update-json-files (in the suite monorepo) would otherwise strip
              # this entry back out of, since it enforces one fixed allow-plugins entry there.
              # `composer global config` was tried first but wasn't honored by every composer
              # subcommand here (still blocked under `composer update --prefer-lowest`), so the
              # project-local config is used instead - Composer always respects that directly.
              run: composer config --no-plugins allow-plugins.php-http/discovery true

            - name: Composer prefer-lowest
              run: composer update --prefer-dist --no-interaction --prefer-lowest --prefer-stable -o

            - name: Codecept run test
              run: composer test
